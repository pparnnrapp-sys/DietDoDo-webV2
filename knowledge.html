<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DietDoDo - Knowledge Base</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-color: #dcecc9; 
      --bg-color-light: #f4f9ec; 
      --text-dark: #2c3e50;
      --text-grey: #7f8c8d;
      --orange: #f27d16;
      --green: #86c140;
    }
    
    body { 
      margin: 0; 
      padding: 0; 
      background: #f9fcf5;
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
    }

    /* Header Styles */
    header { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 8px 40px; font-family: 'Poppins', sans-serif; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); border-bottom: 1px solid rgba(255, 255, 255, 0.6); }
    .logo-container { width: 180px; max-width: 100%; display: block; transition: transform 0.3s ease, filter 0.3s ease; }
    .logo-container:hover { transform: translateY(-2px) scale(1.02); filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.6)) brightness(1.1); }
    nav.menu-links { display: flex; gap: 40px; }
    nav.menu-links a { text-decoration: none; color: var(--text-grey); font-weight: 700; font-size: 18px; letter-spacing: 1.5px; transition: 0.3s; border-bottom: 3px solid transparent; padding-bottom: 5px; }
    nav.menu-links a:hover, nav.menu-links a.active { color: var(--text-dark); transform: translateY(-2px); border-bottom: 3px solid var(--orange); }

    /* Knowledge Content Styles */
    .page-title { text-align: center; font-family: 'Poppins', sans-serif; font-size: 48px; font-weight: 800; color: var(--text-dark); margin: 5px 0 40px 0; }

    /* Search Box Styles */
    .search-container {
      text-align: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }
    #searchInput {
      width: 100%;
      max-width: 500px;
      padding: 15px 25px;
      font-size: 16px;
      border: 2px solid #fff;
      border-radius: 30px;
      outline: none;
      font-family: 'Sarabun', sans-serif;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    #searchInput:focus {
      border-color: var(--green);
      box-shadow: 0 8px 20px rgba(134, 193, 64, 0.2);
    }

    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .article-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      text-decoration: none;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 3px solid transparent;
    }
    .article-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      border-color: var(--green);
    }
    .article-img { width: 100%; height: 200px; background: #eee; object-fit: cover; }
    .article-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .article-title { font-size: 20px; font-weight: bold; margin: 0 0 10px 0; color: var(--green); }

    .loading { text-align: center; font-size: 18px; color: var(--text-grey); padding: 50px; grid-column: 1 / -1; }

    /* Category Filter & Tags */
    .category-filter {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      padding: 0 20px;
    }
    .filter-btn {
      padding: 8px 20px;
      border: 2px solid var(--green);
      background: transparent;
      color: var(--green);
      border-radius: 20px;
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--green);
      color: #fff;
    }
    .category-tag {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      z-index: 2;
    }
    .category-tag.service { background: rgba(241, 196, 15, 0.9); color: #333; } /* สีเหลืองสำหรับโภชนบริการ */
  .category-tag.therapy { background: rgba(134, 193, 64, 0.9); } /* สีเขียวสำหรับโภชนคลินิก */

    /* Keyword Tags in Card */
    .article-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 0; /* ขยับป้ายคำสำคัญขึ้นมาอยู่ใต้ชื่อบทความ */
    }
    .keyword-pill {
      background: var(--orange);
      border: 1px solid var(--orange);
      color: #fff;
      padding: 3px 10px;
      border-radius: 15px; /* กรอบมน */
      font-size: 12px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 10px; padding: 10px; }
      .logo-container { width: 140px; }
      .page-title { font-size: 32px; }
      nav.menu-links { flex-wrap: wrap; justify-content: center; gap: 15px; }
      nav.menu-links a { font-size: 15px; }
      .article-grid { grid-template-columns: 1fr; padding: 0 15px 40px; }
      .search-container { padding: 0 15px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container" aria-label="DietDoDo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="100%" height="auto">
        <defs>
          <style>
            .font-main { font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif; font-weight: 900; font-size: 100px; fill: #0b0b0b; }
            .color-green { fill: #86C140; }
            .color-orange { fill: #F7931E; }
            @keyframes bounce-dot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
            .anim-bounce-dot { animation: bounce-dot 1s ease-in-out 3; }
            @keyframes tree-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
            .anim-tree { animation: tree-sway 1.5s ease-in-out infinite; transform-origin: 30px 25px; }
          </style>
        </defs>
        <text x="20" y="115" class="font-main">D</text>
        <rect x="110" y="55" width="22" height="60" rx="11" class="color-orange" />
        <circle cx="121" cy="30" r="12" class="color-green anim-bounce-dot" />
        <text x="145" y="115" class="font-main">e</text>
        <text x="210" y="115" class="font-main">t</text>
        <text x="275" y="115" class="font-main">D</text>
        <g transform="translate(365, 30)">
          <path class="anim-tree" d="M 5,25 C 2,15 15,5 30,20 C 35,15 50,5 55,25" fill="none" stroke="#86C140" stroke-width="8" stroke-linecap="round"/>
          <circle cx="15" cy="45" r="7" class="color-green" />
          <circle cx="45" cy="45" r="7" class="color-green" />
          <path d="M 5,60 A 25 20 0 0 0 55,60" fill="none" stroke="#0b0b0b" stroke-width="12" stroke-linecap="round"/>
        </g>
        <text x="440" y="115" class="font-main">D</text>
        <g transform="translate(550, 80)">
          <circle cx="0" cy="8" r="22" fill="none" stroke="#0b0b0b" stroke-width="16" />
        </g>
      </svg>
    </a>
    <nav class="menu-links">
      <a href="index.html">HOME</a>
      <a href="menu.html">MENU</a>
      <a href="about.html">ABOUT</a>
    </nav>
  </header>

  <h1 class="page-title">Knowledge Base</h1>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 ค้นหาบทความ (เช่น โภชนศาสตร์, อาหาร, ประเมิน)..." onkeyup="filterArticles()">
  </div>

  <div class="category-filter" id="categoryFilter">
    <button class="filter-btn active" data-cat="all" onclick="selectCategory('all')">ทั้งหมด</button>
    <button class="filter-btn" data-cat="โภชนบริการ" onclick="selectCategory('โภชนบริการ')">โภชนบริการ</button>
    <button class="filter-btn" data-cat="โภชนคลินิก" onclick="selectCategory('โภชนคลินิก')">โภชนคลินิก</button>
  </div>

  <div class="article-grid" id="articles-container">
  </div>

  <script>
    let currentCategory = 'all';

    function selectCategory(cat) {
      currentCategory = cat;
      // เปลี่ยนสถานะปุ่ม (Active/Inactive)
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      filterArticles();
    }

    function filterArticles() {
      const inputText = document.getElementById("searchInput").value.toLowerCase().trim();
      const searchKeywords = inputText ? inputText.split(' ').filter(kw => kw.trim() !== '') : [];
      const cards = document.querySelectorAll(".article-card");

      cards.forEach(card => {
        const titleEl = card.querySelector(".article-title");
        const title = titleEl ? titleEl.innerText.toLowerCase() : '';
        const keywordsEl = card.querySelector(".article-keywords");
        const keywordsText = keywordsEl ? keywordsEl.innerText.toLowerCase() : '';
        const cardCat = card.getAttribute("data-category") || '';
        
        const searchableText = `${title} ${keywordsText}`;
        const textWithoutSpace = searchableText.replace(/\s+/g, '');
        
        const matchText = searchKeywords.length === 0 || searchKeywords.every(kw => 
          searchableText.includes(kw) || textWithoutSpace.includes(kw)
        );
        const matchCat = (currentCategory === 'all') || (cardCat === currentCategory);

        if (matchText && matchCat) {
          card.style.display = "flex";
        } else {
          card.style.display = "none";
        }
      });
    }

    async function loadArticlesFromGitHub() {
      const container = document.getElementById('articles-container');
      const repo = 'pparnnrapp-sys/DietDoDo';
      const folderPath = 'blog';
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${folderPath}?t=${new Date().getTime()}`;

      try {
        container.innerHTML = '<p class="loading">กำลังโหลดบทความจากระบบ...</p>';
        const response = await fetch(apiUrl, { cache: 'no-store' });
        
        if (!response.ok) {
          if (response.status === 403 || response.status === 429) {
            throw new Error('ดึงข้อมูลบ่อยเกินไป (จำกัด 60 ครั้ง/ชม.) กรุณารอสักครู่แล้วรีเฟรชใหม่');
          }
          throw new Error('ไม่พบโฟลเดอร์ หรือยังไม่มีบทความ');
        }
        
        const files = await response.json();
        container.innerHTML = '';

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const rawUrl = `${file.download_url}${file.download_url.includes('?') ? '&' : '?'}t=${new Date().getTime()}`;
            
            // ใช้ rawUrl เพื่อประหยัดโควต้า API (ป้องกันการโดนแบน IP ชั่วคราว)
            let fileRes = await fetch(rawUrl, { cache: 'no-store' });
            if (!fileRes.ok) continue;
            
            const markdownText = await fileRes.text();
            
            let frontmatter = '';
            let body = markdownText.trim();
            
            // ใช้ Regex แยก Frontmatter แก้ปัญหาการชนกับตาราง
            const frontmatterRegex = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/;
            const match = body.match(frontmatterRegex);
            if (match) {
              frontmatter = match[1];
              body = body.substring(match[0].length).trim();
            }

            let yamlData = {};
            try {
              if (frontmatter.trim()) {
                yamlData = jsyaml.load(frontmatter) || {};
              }
            } catch (e) {
              console.error('YAML parse error:', e);
            }

            let title = yamlData.title ? String(yamlData.title) : '';
            if (!title) {
              const titleMatch = body.match(/^#\s+(.+)/m);
              // ถ้าไม่มีชื่อเรื่องจริงๆ ให้ใช้ชื่อไฟล์ แต่ตัดวันที่ (YYYY-MM-DD-) และขีดกลางออก
              title = titleMatch ? titleMatch[1].trim() : file.name.replace('.md', '').replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/-/g, ' ');
            }

            let image = yamlData.cover_image || yamlData.featured_image || yamlData.image || yamlData.cover || yamlData.thumbnail || '';
            if (image) image = String(image);
            image = image || 'https://via.placeholder.com/400x200?text=DietDoDo+Article';

              if (image && !image.startsWith('http') && !image.startsWith('data:')) {
                let cleanImage = image.startsWith('/') ? image.substring(1) : image;
                if (cleanImage.startsWith('./')) cleanImage = cleanImage.substring(2);
                try { cleanImage = decodeURIComponent(cleanImage); } catch(e) {}
                image = `https://raw.githubusercontent.com/${repo}/main/${encodeURI(cleanImage)}?t=${new Date().getTime()}`;
              }

              // ดึงหมวดหมู่ (Category) จาก frontmatter
              let category = yamlData.category ? String(yamlData.category) : '';
            if (category === 'โภชนบำบัด') category = 'โภชนคลินิก'; // รองรับไฟล์บทความเก่าที่ใช้ชื่อเดิม
              let catClass = '';
              if(category === 'โภชนบริการ') catClass = 'service';
            else if(category === 'โภชนคลินิก') catClass = 'therapy';

              const card = document.createElement('a');
              card.className = 'article-card';
              const slug = file.name.replace('.md', '');
              card.href = `article-detail.html?article=${encodeURIComponent(slug)}`;
              card.setAttribute('data-category', category); // เก็บไว้ใช้ตอน Filter
              
              let tagHtml = category ? `<div class="category-tag ${catClass}">${category}</div>` : '';

              // ดึง Keywords มาแสดงเป็นป้ายคำสำคัญ (Tags)
              let keywords = yamlData.keywords || [];
              if (typeof keywords === 'string') {
                keywords = keywords.split(',').map(k => k.trim());
              }
              let keywordsHtml = '';
              if (Array.isArray(keywords) && keywords.length > 0) {
                keywordsHtml = `<div class="article-keywords">${keywords.map(kw => `<span class="keyword-pill">${kw}</span>`).join('')}</div>`;
              }

              card.innerHTML = `
                ${tagHtml}
                <img src="${image}" alt="${title}" class="article-img" onerror="this.src='https://via.placeholder.com/400x200?text=DietDoDo+Article'">
                <div class="article-content">
                  <h3 class="article-title">${title}</h3>
                  ${keywordsHtml}
                </div>
              `;
              container.appendChild(card);
          }
        }
      } catch (error) {
        container.innerHTML = `<p class="loading" style="color:var(--red);">เกิดข้อผิดพลาด: ${error.message}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadArticlesFromGitHub().then(() => {
        // ตรวจสอบ URL parameters เมื่อโหลดบทความเสร็จ
        const urlParams = new URLSearchParams(window.location.search);
        const categoryFromUrl = urlParams.get('category');
        if (categoryFromUrl) {
          selectCategory(categoryFromUrl);
        }
      });
    });
  </script>
</body>
</html>
