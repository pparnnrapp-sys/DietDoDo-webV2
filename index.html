<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DietDoDo - หน้าแรก</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js" type="module"></script>
  <style>
    :root {
      --bg-color: #dcecc9; /* สีขอบ ปรับให้นุ่มละมุนขึ้น */
      --bg-color-light: #f4f9ec; /* สีตรงกลาง สว่างและสะอาดตา */
      --text-dark: #2c3e50; /* สีเทาเข้มอมน้ำเงิน ดูเป็นมืออาชีพและสบายตาขึ้น */
      --text-grey: #7f8c8d; /* สีเทาโทนเย็น ไม่อมน้ำตาล */
      --orange: #f27d16; /* สีส้ม ปรับให้ดูพรีเมียม ไม่แสบตาเกินไป */
      --green: #86c140; /* สีเขียวโลโก้ (คงเอกลักษณ์แบรนด์) */
      --dark-green: #3a6b22; /* สีเขียวเข้ม นุ่มนวลขึ้น */
      --red: #ff6b6b; 
      --yellow: #f1c40f; 
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    body { 
      margin: 0; 
      padding: 0; 
      background: var(--bg-color-light);
      background: radial-gradient(circle at 80% 50%, var(--bg-color-light) 0%, var(--bg-color) 100%);
      background-attachment: fixed;
      font-family: 'Poppins', sans-serif; /* ฟอนต์ไม่มีหัวตามรีเควส */
      overflow: hidden; /* ล็อคหน้าจอให้เป็นสัดส่วนเต็มพอดี */
      height: 100vh;
      position: relative;
    }

    /* Header ส่วนบน */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 40px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* โลโก้ฝั่งซ้าย */
    .logo-container {
      width: 180px; /* ปรับขนาดให้พอดีกับแถบ Header */
      max-width: 100%;
      display: block; /* เพื่อให้โครงสร้างของ a ทำงานได้เหมือน div */
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .logo-container:hover {
      transform: translateY(-2px) scale(1.02); /* ขยับเด้งขึ้นและขยายขนาดนิดนึง */
      filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.6)) brightness(1.1); /* เพิ่มแสงสว่างและเงาเรืองแสง */
    }

    /* เมนูฝั่งขวา */
    nav.menu-links {
      display: flex;
      gap: 40px;
    }
    nav.menu-links a {
      text-decoration: none;
      color: var(--text-grey);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
      padding-bottom: 5px;
    }
    nav.menu-links a:hover, nav.menu-links a.active {
      color: var(--text-dark);
      transform: translateY(-2px);
      border-bottom: 3px solid var(--orange);
    }

    /* คอนเทนต์หลักกลางซ้าย */
    .hero-content {
      position: absolute;
      top: 28%; /* ขยับสูงขึ้นมาให้อยู่ในระดับสายตาที่พอดี */
      left: 80px;
      transform: translateY(-50%); /* จัดให้อยู่กึ่งกลางพอดีเป๊ะ */
      z-index: 10;
      animation: fadeInUp 1s ease-out forwards;
    }
    .main-text {
      font-size: 64px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.15;
      max-width: 600px;
      margin-bottom: 10px; 
    }

    .sub-quote {
      font-size: 28px;
      font-weight: 700;
      color: var(--dark-green);
      margin-bottom: 5px; /* เว้นระยะให้หายใจ */
      margin-left: 0; /* จัดชิดซ้ายตรงกับข้อความหลัก */
    }
    .author-text {
      font-size: 18px; /* ปรับให้ตัวเล็กลงเพื่อไม่แย่งความสนใจ */
      color: var(--text-grey);
      font-style: italic; /* ทำเป็นตัวเอียงให้ดูเหมือนเครดิตผู้แต่ง */
      margin-left: 0px;
      margin-bottom: 20px; /* เว้นระยะห่างก่อนถึงปุ่ม START */
    }
    .start-btn {
      display: inline-block;
      background-color: var(--orange);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      padding: 10px 30px;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 8px 15px rgba(255, 127, 0, 0.3);
      transition: all 0.3s ease; /* เปลี่ยนเป็น all เพื่อให้แอนิเมชันทำงานกับทุกค่าที่เปลี่ยน */
      margin-left: 0; /* วางชิดซ้ายให้ตรงกับขอบข้อความทั้งหมด */
    }
    .mobile-btn {
      display: none;
    }
    .start-btn:hover {
      transform: translateY(-5px) scale(1.05); /* เด้งขึ้น 5px และขยายปุ่มขึ้น 5% */
      box-shadow: 0 15px 25px rgba(255, 127, 0, 0.5); /* เพิ่มเงาให้ฟุ้งและกว้างขึ้น */
      background-color: #ff9429; /* เปลี่ยนสีส้มให้สว่างขึ้นเล็กน้อย */
    }

    /* แอนิเมชันฝั่งขวาล่าง */
    .hero-animation {
      position: absolute;
      bottom: -140px;
      right: -60px;
      z-index: 5;
      width: 700px;
      height: 700px;
      max-width: 90vw;
      max-height: 90vw;
    }

    /* ไอคอนพื้นหลังแบบลายเส้น (Floating Icons) */
    .bg-icons {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%; /* เปลี่ยนเป็น 100% ให้กระจายทั่วจอ */
      height: 100%;
      z-index: 1;
      pointer-events: none; /* ไม่ให้ขัดขวางการคลิกของเมนู/ปุ่ม */
    }
    .bg-icon {
      position: absolute;
      opacity: 0.3; /* ปรับให้สีสันชัดเจนขึ้นอีกนิด */
      animation: float-bg 6s ease-in-out infinite;
    }
    .bg-icon svg {
      width: 100%;
      height: 100%;
      stroke: var(--text-dark);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); /* เพิ่มเงาให้ดูมีมิติ */
    }
    .bg-icon.orange svg {
      stroke: var(--orange); /* เปลี่ยนสีลายเส้นเป็นสีส้ม */
    }
    .bg-icon.green svg {
      stroke: var(--green); /* สีเขียว */
    }
    .bg-icon.red svg {
      stroke: var(--red); /* สีแดง */
    }
    .bg-icon.grey svg {
      stroke: var(--text-grey); /* สีเทาอมน้ำตาล */
    }
    .bg-icon.yellow svg {
      stroke: var(--yellow); /* สีเหลือง */
    }
    .bg-icon-1 { top: 20%; left: 8%; width: 90px; height: 70px; animation-delay: 0s; }
    .bg-icon-1 svg { transform: rotate(-15deg); }
    .bg-icon-2 { top: 20%; left: 50%; width: 100px; height: 100px; animation-delay: 2s; } /* ย้ายแครอทมาอยู่บนหัวใจ */
    .bg-icon-2 svg { transform: rotate(25deg); }
    .bg-icon-3 { top: 55%; left: 4%; width: 80px; height: 80px; animation-delay: 4s; }
    .bg-icon-3 svg { transform: rotate(-10deg); }
    .bg-icon-4 { top: 20%; left: 28%; width: 65px; height: 65px; animation-delay: 1.5s; }
    .bg-icon-4 svg { transform: rotate(15deg); }
    .bg-icon-5 { bottom: 25%; left: 46%; width: 75px; height: 75px; animation-delay: 1s; }
    .bg-icon-5 svg { transform: rotate(20deg); }
    .bg-icon-6 { top: 65%; left: 25%; width: 85px; height: 85px; animation-delay: 3.5s; }
    .bg-icon-6 svg { transform: rotate(-25deg); }
    .bg-icon-7 { top: 35%; left: 40%; width: 60px; height: 60px; animation-delay: 2.5s; } /* ย้ายหัวใจมาลอยเหนือคำว่า eat */
    .bg-icon-7 svg { transform: rotate(10deg); }
    .bg-icon-8 { bottom: 5%; left: 35%; width: 90px; height: 90px; animation-delay: 0.5s; }
    .bg-icon-8 svg { transform: rotate(-15deg); }

    @keyframes float-bg {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    
    /* แอนิเมชันเปิดตัวข้อความ */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .hero-content { left: 50px; }
      .main-text { font-size: 48px; }
      .sub-quote { font-size: 28px; }
      .author-text { font-size: 18px; }
      .hero-animation { right: 20px; bottom: 20px; }
    }
    @media (max-width: 768px) {
      body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100vh; display: flex; flex-direction: column; }
      header { position: sticky; flex-direction: column; gap: 8px; padding: 10px; }
      .logo-container { width: 140px; }
      nav.menu-links { flex-wrap: wrap; justify-content: center; gap: 15px; }
      nav.menu-links a { font-size: 15px; }
      .hero-content { position: relative; top: auto; left: auto; transform: none; text-align: center; width: 100%; padding: 30px 20px 10px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
      .main-text { font-size: 38px; margin-bottom: 10px; margin-left: auto; margin-right: auto; }
      .sub-quote { font-size: 20px; margin-bottom: 5px; }
      .author-text { font-size: 14px; margin-bottom: 20px; }
      .desktop-btn { display: none; }
      .mobile-btn { display: inline-block; font-size: 18px; padding: 10px 30px; margin: -40px auto 40px auto; align-self: center; position: relative; z-index: 10; }
      .hero-animation { position: relative; bottom: auto; right: auto; left: auto; transform: none; width: 100%; max-width: 400px; height: 400px; margin: -80px auto 10px auto; z-index: 5; }
      .bg-icon { opacity: 0.25; } /* ปรับความเข้มขึ้นนิดนึงเพื่อให้เห็นความมีมิติชัดขึ้น */
      .bg-icon-1 { width: 75px; height: 55px; }
      .bg-icon-2 { width: 85px; height: 85px; }
      .bg-icon-3 { width: 70px; height: 70px; }
      .bg-icon-4 { width: 55px; height: 55px; }
      .bg-icon-5 { width: 65px; height: 65px; }
      .bg-icon-6 { width: 70px; height: 70px; }
      .bg-icon-7 { width: 50px; height: 50px; }
      .bg-icon-8 { width: 75px; height: 75px; }
    }
    @media (max-width: 480px) {
      header { padding: 8px; }
      .logo-container { width: 120px; }
      nav.menu-links { gap: 10px; }
      nav.menu-links a { font-size: 13px; }
      .hero-content { padding-top: 20px; }
      .main-text { font-size: 32px; }
      .sub-quote { font-size: 16px; }
      .hero-animation { max-width: 340px; height: 340px; margin: -80px auto 10px auto; }
      .bg-icon-1 { width: 60px; height: 45px; }
      .bg-icon-2 { width: 70px; height: 70px; }
      .bg-icon-3 { width: 55px; height: 55px; }
      .bg-icon-4 { width: 45px; height: 45px; }
      .bg-icon-5 { width: 50px; height: 50px; }
      .bg-icon-6 { width: 55px; height: 55px; }
      .bg-icon-7 { width: 40px; height: 40px; }
      .bg-icon-8 { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>
